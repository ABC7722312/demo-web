<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀点数計算</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1b1f24;--mu:#5d6670;--bd:#c9ced6;--ac:#0b6b4a;--acf:#fff;--er:#b3261e;--erb:#fdecea;--ok:#0b6b4a;--m:#c0392b;--p:#1f5fbf;--s:#1d7a46;--z:#333}
@media(prefers-color-scheme:dark){:root{--bg:#121416;--card:#1c1f23;--fg:#eceff3;--mu:#9aa4af;--bd:#3a4048;--ac:#3ecf9a;--acf:#06281c;--er:#ff8a80;--erb:#3a1c1a;--ok:#3ecf9a;--m:#ff8a7a;--p:#7fb0ff;--s:#62d58f;--z:#ddd}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header,main{max-width:1080px;margin:auto;padding:0 12px}header{padding-top:10px}h1{font-size:20px;margin:0}header p{margin:0;color:var(--mu);font-size:13px}
main{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;padding-top:10px}#L,#R{display:contents}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;min-width:0}
h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h2 .n{background:var(--fg);color:var(--bg);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px}
h3{font-size:13px;margin:10px 0 4px;color:var(--mu)}
.btn{min-height:44px;min-width:44px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;padding:0 12px;cursor:pointer}
.btn[aria-pressed=true]{border:2px solid var(--ac);font-weight:700;background:color-mix(in srgb,var(--ac) 14%,var(--card))}.btn[aria-pressed=true]::before{content:"✓ "}
.btn:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}.btn:focus-visible{outline:3px solid var(--p);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:6px}.row.g{gap:4px}.mu{color:var(--mu);font-size:13px}
.tile{display:block;border:0;background:none;padding:0;cursor:pointer;line-height:0;color:inherit;border-radius:6px;transition:transform .08s}.tile svg{width:100%;height:auto;display:block}
.tile:not(:disabled):hover{transform:translateY(-2px)}.tile:focus-visible{outline:3px solid var(--p);outline-offset:2px}.tile:disabled{opacity:.35;filter:grayscale(1);cursor:not-allowed}
.pal{display:grid;grid-template-columns:repeat(9,minmax(0,46px));gap:5px;justify-content:start}.hand .tile{width:40px}.mini .tile{width:30px;cursor:default}
.tile.sel{outline:3px solid var(--ac);outline-offset:2px;transform:translateY(-4px)}.tile.win svg{outline:2px solid var(--er);outline-offset:1px;border-radius:6px}.badge{display:block;font-size:10px;line-height:13px;height:13px;color:var(--er);font-weight:700;text-align:center}
.tiles{min-height:84px;border:2px dashed var(--bd);border-radius:10px;padding:8px;align-items:flex-end}.tiles.err{border-color:var(--er);background:var(--erb)}.empty{color:var(--mu);align-self:center}
.meld{display:flex;gap:4px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:4px 6px}
.status{font-size:13px;font-weight:700}.status.bad{color:var(--er)}.status.good{color:var(--ok)}
.primary{width:100%;min-height:56px;font-size:18px;font-weight:800;background:var(--ac);color:var(--acf);border:0;border-radius:12px;cursor:pointer}.primary:disabled{opacity:.45;cursor:not-allowed}.primary:focus-visible{outline:3px solid var(--p);outline-offset:2px}
#calc{position:sticky;bottom:0;z-index:5;box-shadow:0 -6px 12px rgba(0,0,0,.12)}
.box{border-radius:12px;padding:12px;border:2px solid}.box.err{background:var(--erb);border-color:var(--er);color:var(--fg)}.fix{margin:6px 0 0;font-weight:700}
.score{text-align:center;padding:10px;border-radius:12px;border:2px solid var(--ac)}.score.ym{border-width:4px;background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;background:var(--ac);color:var(--acf);font-weight:800}.pts{font-size:44px;font-weight:900;line-height:1.1}.pts small{font-size:18px}
table{width:100%;border-collapse:collapse}td{padding:5px 2px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;white-space:nowrap}.tot td{font-weight:800}
details{margin-top:6px}summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}.stale{opacity:.45}.stale::before{content:"入力が変わりました。再計算してください";display:block;color:var(--er);font-weight:700;opacity:1}
.step{display:flex;align-items:center;gap:4px}.step span{min-width:2ch;text-align:center;font-weight:700}
@media(min-width:900px){main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px;align-items:start}#L{display:flex;flex-direction:column;gap:12px}#R{display:flex;flex-direction:column;gap:12px;position:sticky;top:10px}#calc{position:static;box-shadow:none;padding:0;border:0;background:none}}
</style></head><body>
<header><h1>麻雀点数計算</h1><p>① 手牌を入力 → ③ 和了条件 → ④ 計算（日本式リーチ・4人打ち）</p></header>
<main><div id="L"><section id="hand"></section><section id="pal"></section><section id="cond"></section></div><div id="R"><section id="calc"></section><section id="res" hidden></section></div></main>
<script src="app.js"></script></body></html>
