<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻雀点数計算</title>
<style>:root{--bg:#fff;--fg:#1a1a1a;--bd:#ccc}@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#eee;--bd:#444}}
body{font:15px system-ui;background:var(--bg);color:var(--fg);max-width:720px;margin:auto;padding:12px}
input,select,button{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px;margin:2px}
label{display:inline-block;margin:2px 8px 2px 0}#pal button{min-width:38px}.err{color:#d33}#go{width:100%;padding:12px;font-weight:700}</style></head><body>
<h1>麻雀点数計算</h1><div id="pal"></div>
<p>手牌(和了牌含む・鳴き除く) <input id="hand" data-tile="1" size="30" placeholder="234m234567p789s55s">　和了牌 <input id="win" size="4" value="4p"></p>
<p>鳴き (chi/pon/ankan/minkan/kakan:牌) <input id="melds" size="30" placeholder="chi:123m pon:5z"></p>
<p>ドラ表示 <input id="dora" size="8"> 裏ドラ表示 <input id="ura" size="8"> 赤は 0 (例 0p)</p>
<label><input type="checkbox" id="tsumo">ツモ</label><label><input type="checkbox" id="dealer">親</label>
<label>場風<select id="rw"><option value="0">東</option><option value="1">南</option></select></label>
<label>自風<select id="sw"><option value="0">東</option><option value="1">南</option><option value="2">西</option><option value="3">北</option></select></label>
<label>立直<select id="riichi"><option value="0">なし</option><option value="1">立直</option><option value="2">ダブル</option></select></label>
<label><input type="checkbox" id="ippatsu">一発</label><label><input type="checkbox" id="haitei">海底/河底</label><label><input type="checkbox" id="rinshan">嶺上</label><label><input type="checkbox" id="chankan">槍槓</label>
<label><input type="checkbox" id="kuitan" checked>喰いタン</label><label><input type="checkbox" id="kiriage">切り上げ満貫</label>
<label>本場<input id="honba" type="number" value="0" min="0" style="width:56px"></label><label>供託<input id="kyotaku" type="number" value="0" min="0" style="width:56px"></label>
<button id="go">計算</button><div id="out"></div><script src="app.js"></script></body></html>
